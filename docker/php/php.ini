; Giá trị khởi đầu cho việc nạp và xuất tệp lớn.
; Phải chốt lại theo bài đo tải với bộ thử 1 triệu và 5 triệu dòng.
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 0
max_input_time = 600

; Tệp tạm khi giải nén và tạo XLSX nằm trong volume riêng, không dùng /tmp mặc định.
upload_tmp_dir = /var/www/html/storage/app/tmp
sys_temp_dir = /var/www/html/storage/app/tmp

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

date.timezone = Asia/Ho_Chi_Minh
