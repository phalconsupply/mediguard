server {
    listen 80;
    server_name _;

    # Chỉ thư mục public được phục vụ. Tệp chứa dữ liệu bệnh nhân nằm trong
    # storage/, ngoài web root, và chỉ tải được qua route có kiểm tra quyền.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 512M;

    # Tệp phản hồi lớn mất vài phút để sinh; giữ kết nối đủ lâu cho bước xuất.
    fastcgi_read_timeout 600;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/mediguard.access.log;
    error_log  /var/log/nginx/mediguard.error.log;
}
